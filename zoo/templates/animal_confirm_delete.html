{% extends 'base.html' %}
{% block title %}Удаление животного{% endblock %}

{% block content %}
<h1>Удалить животное «{{ animal.name }}»?</h1>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-del" type="submit">Удалить</button>
    <a class="btn btn-back" href="{% url 'animal_list' %}">Вернуться к списку животных</a>
</form>
{% endblock %}
