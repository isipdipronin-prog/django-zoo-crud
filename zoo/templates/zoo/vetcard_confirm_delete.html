{% extends 'base.html' %}
{% block title %}Удаление веткарты{% endblock %}
{% block content %}
<h1>Удалить ветеринарную карту для «{{ vetcard.animal.name }}»?</h1>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-del" type="submit">Удалить</button>
    <a class="btn btn-back" href="{% url 'vetcard_list' %}">Вернуться к списку веткарт</a>
</form>
{% endblock %}
