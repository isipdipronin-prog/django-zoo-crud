<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Зоопарк{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f7f5; color: #222; }
        nav { background: #2e6f40; padding: 14px 24px; display: flex; gap: 18px; flex-wrap: wrap; }
        nav a { color: #fff; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1000px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; }
        th { background: #e8f1eb; }
        .btn { display: inline-block; padding: 7px 14px; background: #2e6f40; color: #fff; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
        .btn-edit { background: #d9822b; }
        .btn-del { background: #c93b2b; }
        .btn-back { background: #666; }
        .photo-thumb { max-width: 100px; max-height: 80px; border-radius: 4px; object-fit: cover; }
        .photo-large { max-width: 380px; border-radius: 6px; margin: 12px 0; display: block; }
        form p { margin-bottom: 12px; }
        form label { display: block; font-weight: bold; margin-bottom: 4px; }
        form input[type="text"], form input[type="number"], form input[type="time"], form select, form textarea {
            width: 100%; max-width: 500px; padding: 7px; border: 1px solid #ccc; border-radius: 4px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'index' %}">Главная</a>
        <a href="{% url 'animal_list' %}">Животные</a>
        <a href="{% url 'enclosure_list' %}">Вольеры</a>
        <a href="{% url 'keeper_list' %}">Сотрудники</a>
        <a href="{% url 'vetcard_list' %}">Ветеринарные карты</a>
        <a href="{% url 'feeding_list' %}">Расписание кормлений</a>
        <a href="/admin/">Админ-панель</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
